<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0066FF">
  <meta name="description" content="Square Trivia - Win prizes based on your sports knowledge and quick thinking. 100% skill-based competition with NO FEES!">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://squaretrivia.com/">
  <meta property="og:title" content="Square Trivia - Skill-Based Sports Competition">
  <meta property="og:description" content="Win prizes based on your sports knowledge. Answer trivia questions quickly to claim squares and compete for guaranteed prizes!">
  <meta property="og:image" content="/og-image.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <title>Square Trivia - Skill-Based Sports Competition</title>
  
  <style>
    /* Critical CSS for initial load */
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f3f4f6;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Loading spinner for initial app load */
    .app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .app-loader-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #f3f4f6;
      border-top: 3px solid #0066FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide loader when React loads */
    body.react-loaded .app-loader {
      display: none;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding: 20px; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>Square Trivia requires JavaScript to be enabled. Please enable JavaScript in your browser settings to continue.</p>
    </div>
  </noscript>
  
  <!-- Initial loading spinner -->
  <div class="app-loader" id="app-loader">
    <div class="app-loader-spinner"></div>
  </div>
  
  <!-- React root -->
  <div id="root"></div>
  
  <!-- Remove loader when React is ready -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.body.classList.add('react-loaded');
      }, 100);
    });
  </script>
</body>
</html>
